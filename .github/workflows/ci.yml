name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER_TEST }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_TEST }}
          POSTGRES_DB: eduflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d eduflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          NODE_ENV: test
        run: npm run migrate

      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          FRONTEND_URL: http://localhost:3000
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
          NODE_ENV: test
        run: npm test -- --coverage --runInBand

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          retention-days: 30
          path: |
            backend/test-report.html
            backend/coverage/
